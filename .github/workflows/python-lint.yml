name: Python Lint & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check --output-format=github orion/scripts/

      - name: Run Ruff format check
        run: ruff format --check orion/scripts/

      - name: Verify Python files
        run: |
          echo "✅ Found $(find orion/scripts -name '*.py' | wc -l) Python scripts"
          echo "✅ Python linting completed successfully"
