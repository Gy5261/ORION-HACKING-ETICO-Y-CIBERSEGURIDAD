name: Python Lint & Format

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Ruff
        run: pip install ruff
      
      - name: Lint with Ruff
        run: ruff check .
      
      - name: Format check with Ruff
        run: ruff format --check .