name: Python Lint & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python scripts
        run: |
          ruff check orion/scripts/
          ruff format --check orion/scripts/

      - name: Verify structure
        run: |
          echo "✅ Python files verified: $(find orion/scripts -name '*.py' | wc -l) scripts"
