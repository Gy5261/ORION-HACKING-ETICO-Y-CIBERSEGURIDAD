name: CI Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-diagnostic-main
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reproducible checks
        id: checks
        shell: bash
        run: |
          set +e
          : > ci-diagnostic.log
          failed=0

          run_check() {
            label="$1"
            shift
            {
              echo
              echo "===== ${label} ====="
              echo "+ $*"
              "$@"
              code=$?
              echo "exit_code=${code}"
            } >> ci-diagnostic.log 2>&1
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          }

          run_check "python" python --version
          run_check "pip" python -m pip --version
          run_check "install" python -m pip install .
          run_check "compile" python -m compileall -q orion tools
          run_check "registry" python -c "from orion.plugins.core import PluginRegistry; r=PluginRegistry(); print([p.metadata.plugin_id for p in r.list()]); assert len(r.list()) == 9"
          run_check "doctor" python -m orion plugins doctor
          run_check "validator" python tools/validate_repository.py

          cat ci-diagnostic.log
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Publish failure report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "Automated CI diagnostic for commit \`${SHA}\`."
            echo
            echo '```text'
            tail -n 350 ci-diagnostic.log
            echo '```'
          } > ci-issue.md
          gh issue create \
            --repo "$REPOSITORY" \
            --title "CI diagnostic ${SHA:0:8}" \
            --body-file ci-issue.md
