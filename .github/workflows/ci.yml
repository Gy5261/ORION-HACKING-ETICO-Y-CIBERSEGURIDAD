name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.15"}
          - {os: windows-latest, python: "3.15"}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and MCP SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ".[dev,mcp]"
          python -m pip check

      - name: Compile source
        run: |
          set -euo pipefail
          python -m compileall -q orion tools tests

      - name: Lint MCP surface
        run: |
          set -euo pipefail
          python -m ruff check \
            orion/mcp \
            orion/resources.py \
            orion/runtime_info.py \
            tests/test_python315_hardening.py \
            tests/test_mcp_compat.py \
            tests/test_mcp_transports.py

      - name: Validate shell bootstrap (offline)
        if: runner.os == 'Linux'
        run: |
          bash -n orion/scripts/install-safe-tooling.sh
          bash orion/scripts/install-safe-tooling.sh --plan --category core

      - name: Validate PowerShell bootstrap (offline)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'orion/scripts/install-safe-tooling.ps1').Path,
            [ref]$tokens,
            [ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -gt 0) { throw ($errorsFound | Out-String) }
          $plan = ./orion/scripts/install-safe-tooling.ps1 -Category core | ConvertFrom-Json
          if ($plan.mode -ne 'plan' -or $plan.contact_network -ne $false) {
            throw 'Default PowerShell installer must be read-only'
          }

      - name: Check undefined symbols throughout Python source
        run: |
          python -m ruff check --select E4,E7,E9,F821,F822,F823 orion tools tests

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python tools/validate_repository.py

      - name: Test MCP interoperability
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_mcp_compat.py \
            tests/test_mcp_transports.py

      - name: Test full offline suite
        run: python -m pytest -v

      - name: Check isolated script sanity
        run: python orion/scripts/run_skill_sanity.py

      - name: Build and verify standalone knowledge site
        if: runner.os == 'Linux' && matrix.python == '3.15'
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m orion.scripts.build_singlefile_site
          python tools/verify_singlefile.py orion/ORION-HACKING-singlefile.html --js-output orion-site-syntax.js
          node --check orion-site-syntax.js

      - name: Upload verified standalone HTML
        if: runner.os == 'Linux' && matrix.python == '3.15'
        uses: actions/upload-artifact@v4
        with:
          name: orion-standalone-html
          path: orion/ORION-HACKING-singlefile.html
          if-no-files-found: error
          retention-days: 14

      - name: Build wheel and sdist
        run: python -m build --outdir "$RUNNER_TEMP/orion-dist"

      - name: Report runtime capabilities
        run: python -m orion runtime-info --json

      - name: Validate runtime
        run: |
          set -euo pipefail
          python -m orion plugins doctor > orion-doctor.json
          python -m orion plugins list --json > orion-manifest.json
          python -m orion.mcp.server --transport streamable-http --print-config > orion-mcp-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path("orion-doctor.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("orion-manifest.json").read_text(encoding="utf-8"))
          mcp_config = json.loads(Path("orion-mcp-config.json").read_text(encoding="utf-8"))

          assert doctor["ok"] is True, doctor
          assert doctor["plugin_count"] == 9, doctor
          assert manifest["manifest_version"] == "2.0", manifest
          assert len(manifest["plugins"]) == 9, manifest
          assert mcp_config["transport"] == "streamable-http", mcp_config
          assert mcp_config["endpoint"].endswith("/mcp"), mcp_config
          print("ORION Python 3.15 / compatible runtime verification passed")
          PY
