name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
      - name: Static validation
        run: |
          ruff check orion/plugins orion/mcp orion/cli.py orion/resources.py tests tools
          python -m compileall -q orion tests tools
          python tools/validate_repository.py
      - name: Tests
        run: python -m pytest
      - name: Runtime smoke tests
        run: |
          orion plugins doctor
          orion plugins list --json
          python -c "from orion.mcp.server import build_server; assert build_server()"

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base runtime
        run: python -m pip install .
      - name: Validate runtime
        run: |
          python -m compileall -q orion
          orion plugins doctor
          python -c "from orion.plugins.core import PluginRegistry; assert len(PluginRegistry().list()) == 9"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip "build>=1.2,<2"
          python -m build
          python -m venv /tmp/orion-wheel
          /tmp/orion-wheel/bin/pip install dist/*.whl
          /tmp/orion-wheel/bin/orion plugins doctor
          /tmp/orion-wheel/bin/orion plugins list --json
