name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Validate source
        run: |
          python -m compileall -q orion tools
          python tools/validate_repository.py

      - name: Validate runtime
        run: |
          python -m orion plugins doctor
          python -m orion plugins list --json > /tmp/orion-plugins.json
          python - <<'PY'
          import json
          from pathlib import Path
          from orion.plugins.core import PluginRegistry

          registry = PluginRegistry()
          identifiers = [plugin.metadata.plugin_id for plugin in registry.list()]
          assert len(identifiers) == 9, identifiers
          assert len(set(identifiers)) == 9, identifiers

          manifest = json.loads(Path("/tmp/orion-plugins.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == "2.0"
          assert len(manifest["plugins"]) == 9
          print("ORION CI verification passed")
          PY
