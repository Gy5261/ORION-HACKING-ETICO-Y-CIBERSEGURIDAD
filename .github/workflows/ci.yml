name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Compile source
        run: |
          set -euo pipefail
          python -m compileall -q orion tools tests

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python tools/validate_repository.py

      - name: Validate runtime
        run: |
          set -euo pipefail
          python -m orion plugins doctor > /tmp/orion-doctor.json
          python -m orion plugins list --json > /tmp/orion-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path("/tmp/orion-doctor.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("/tmp/orion-manifest.json").read_text(encoding="utf-8"))

          assert doctor["ok"] is True, doctor
          assert doctor["plugin_count"] == 9, doctor
          assert manifest["manifest_version"] == "2.0", manifest
          assert len(manifest["plugins"]) == 9, manifest
          print("ORION verification passed")
          PY
