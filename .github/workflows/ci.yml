name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TARGET_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$TARGET_REF"
          git checkout --detach FETCH_HEAD
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA"

      - name: Verify repository
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q orion tools tests
          python3 tools/validate_repository.py
          python3 -m orion plugins doctor > /tmp/orion-doctor.json
          python3 -m orion plugins list --json > /tmp/orion-manifest.json
          python3 -c 'import json; from pathlib import Path; doctor=json.loads(Path("/tmp/orion-doctor.json").read_text()); manifest=json.loads(Path("/tmp/orion-manifest.json").read_text()); assert doctor["ok"] is True, doctor; assert doctor["plugin_count"] == 9, doctor; assert manifest["manifest_version"] == "2.0", manifest; assert len(manifest["plugins"]) == 9, manifest; print("ORION verification passed")'
