name: Controlled review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install '.[dev,mcp]'
          python -m pip check
      - name: Record protocol baseline
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import mcp.types as types
          print('SDK:', version('mcp'))
          print('SDK latest protocol:', getattr(types, 'LATEST_PROTOCOL_VERSION', 'not exposed'))
          PY
      - name: Validate repository contracts
        run: python tools/validate_repository.py
      - name: Test complete suite without external targets
        run: python -m pytest -v --junitxml=/tmp/orion-tests.xml
      - name: Build distributions
        run: python -m build --outdir /tmp/orion-dist
      - name: Check runtime
        run: python -m orion plugins doctor
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-controlled-test-evidence
          path: /tmp/orion-tests.xml
          retention-days: 7
