name: Build ORION Singlefile HTML

on:
  push:
    branches: [ main ]
    paths:
      - 'orion/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'orion/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run singlefile build
        run: python orion/scripts/build_singlefile_site.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-singlefile-html
          path: orion/ORION-HACKING-singlefile.html
          retention-days: 7
