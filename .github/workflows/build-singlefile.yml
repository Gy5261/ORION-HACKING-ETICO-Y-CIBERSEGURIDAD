name: Build ORION Singlefile HTML

on:
  push:
    branches: [ main ]
    paths:
      - 'orion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt || echo "No external dependencies required"

      - name: Build singlefile HTML
        run: python orion/scripts/build_singlefile_site.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-singlefile-html
          path: orion/ORION-HACKING-singlefile.html
          if-no-files-found: error

      - name: Verify build
        run: |
          if [ -f "orion/ORION-HACKING-singlefile.html" ]; then
            echo "✅ Singlefile HTML built successfully"
            ls -lh orion/ORION-HACKING-singlefile.html
          else
            echo "❌ Build failed"
            exit 1
          fi
