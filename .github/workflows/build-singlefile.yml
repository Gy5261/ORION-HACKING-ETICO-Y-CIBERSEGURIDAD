name: Build ORION Singlefile HTML

on:
  push:
    branches: [ main ]
    paths:
      - 'orion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run singlefile build
        run: python orion/scripts/build_singlefile_site.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-singlefile-html
          path: orion/ORION-HACKING-singlefile.html
