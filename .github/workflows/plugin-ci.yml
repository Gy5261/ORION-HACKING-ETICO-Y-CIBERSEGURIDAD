name: Plugin Runtime CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint plugin runtime
        run: ruff check orion/plugins orion/cli.py orion/__main__.py tests/test_plugins.py tests/test_cli.py

      - name: Verify formatting
        run: ruff format --check orion/plugins orion/cli.py orion/__main__.py tests/test_plugins.py tests/test_cli.py

      - name: Type check
        run: mypy orion/plugins orion/cli.py orion/__main__.py

      - name: Unit tests
        run: pytest

      - name: Runtime doctor
        run: orion plugins doctor

      - name: Verify generated manifest
        run: |
          orion plugins export-manifest --output /tmp/skills.generated.json
          python -c "import json; data=json.load(open('/tmp/skills.generated.json')); assert len(data['plugins']) == 3"

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: orion plugins list --json
      - run: python -m orion plugins doctor
