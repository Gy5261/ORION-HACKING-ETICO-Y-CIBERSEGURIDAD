[project]
name = "orion-hacking-etico"
description = "Base de conocimiento profesional para hacking ético, ciberseguridad defensiva y automatización segura."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["cybersecurity", "ethical-hacking", "red-team", "blue-team", "pentesting", "automation", "orion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Gy5261/ORION-HACKING-ETICO-Y-CIBERSEGURIDAD"
"Bug Reports" = "https://github.com/Gy5261/ORION-HACKING-ETICO-Y-CIBERSEGURIDAD/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"