[project]
name = "orion-hacking-etico"
version = "0.1.0"
description = "Framework profesional de skills para ciberseguridad ética y automatización con IA - ORION"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Gy5261/ORION-HACKING-ETICO-Y-CIBERSEGURIDAD"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
